# Sur les autres branches : vérifie seulement que les recettes et les calculs sont valides.
name: Vérifier les recettes

on:
  push:
    branches-ignore: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
